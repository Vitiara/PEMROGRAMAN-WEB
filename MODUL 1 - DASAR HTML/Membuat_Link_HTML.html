<!doctype html>
<html>
  <head>
    <title>Penggunaan Tag Link</title>
  </head>
  <body>
    <!-- Penggunaan tag link eksternal -->
    <h1>Belajar Tag Link</h1>
    <p>Saya sedang belajar HTML di</p>
    <a href="http://www.unipma.ac.id">Universitas PGRI Madiun</a>
    <br />

    <h1>Belajar Tag Link (Alamat Relatif)</h1>
    <p>
      Halaman HTML pertama saya adalah
      <a href="PRAKTIKUM MODUL 1.html">Hello World!</a>
    </p>
    <br />

    <h1>Belajar Tag Link Target</h1>
    <p>
      Saya sedang belajar HTML di
      <a href="http://www.unipma.ac.id" target="_blank"
        >Universitas PGRI Madiun</a
      >
      dan akan terbuka pada tab baru
    </p>
  </body>
</html>
