<!doctype html>
<html>
  <head>
    <title>Belajar Membuat Form</title>
  </head>
  <body>
    <form action="formulir.html" method="get">
      Nama: <input type="text" name="nama" value="Nama Kamu" /> <br />
      <br />
      Password: <input type="password" name="password" /> <br />
      <br />
      Jenis Kelamin:
      <input type="radio" name="jenis_kelamin" value="laki-laki" checked />
      Laki-laki
      <input type="radio" name="jenis_kelamin" value="perempuan" />
      Perempuan
      <br /><br />
      Hobi: <input type="checkbox" name="hobi_baca" /> Membaca Buku Hobi:
      <input type="checkbox" name="hobi_nulis" /> Menulis Hobi:
      <input type="checkbox" name="hobi_mancing" /> Memancing <br /><br />
      Asal Kota:
      <select name="asal_kota">
        <option value="Kota Jakarta"></option>
        <option>"Bandung"</option>
        <option value="Kota Semarang"></option>
      </select>
      <br /><br />
      Komentar Anda:
      <textarea name="Komentar" rows="5" cols="20">
        Silahkan katakan isi hati anda
      </textarea>
      <br />
      <input type="submit" value="Mulai Prosesi!" />
    </form>
  </body>
</html>
